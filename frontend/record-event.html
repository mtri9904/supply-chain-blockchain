<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi nhận sự kiện - Supply Chain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-calendar-plus me-2"></i>
                            Ghi nhận sự kiện chuỗi cung ứng
                        </h4>
                    </div>
                    <div class="card-body">
                        <form id="recordEventForm">
                            <div class="mb-3">
                                <label for="productId" class="form-label">Mã sản phẩm *</label>
                                <input type="text" class="form-control" id="productId" 
                                       placeholder="Nhập mã sản phẩm (VD: SP001)" required>
                            </div>

                            <div class="mb-3">
                                <label for="eventType" class="form-label">Loại sự kiện *</label>
                                <select class="form-select" id="eventType" required>
                                    <option value="">-- Chọn loại sự kiện --</option>
                                    <option value="Trồng cây">Trồng cây</option>
                                    <option value="Bón phân">Bón phân</option>
                                    <option value="Tưới nước">Tưới nước</option>
                                    <option value="Thu hoạch">Thu hoạch</option>
                                    <option value="Sơ chế">Sơ chế</option>
                                    <option value="Đóng gói">Đóng gói</option>
                                    <option value="Vận chuyển">Vận chuyển</option>
                                    <option value="Nhập kho">Nhập kho</option>
                                    <option value="Kiểm tra chất lượng">Kiểm tra chất lượng</option>
                                    <option value="Bán ra">Bán ra</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Mô tả chi tiết *</label>
                                <textarea class="form-control" id="description" rows="3" 
                                          placeholder="Mô tả chi tiết sự kiện (VD: Thu hoạch 200kg rau cải sạch tại HTX An Phú)..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="imageUpload" class="form-label">Hình ảnh minh chứng (tùy chọn)</label>
                                <input type="file" class="form-control" id="imageUpload" 
                                       accept="image/*">
                                <div class="form-text">Tải lên hình ảnh minh chứng cho sự kiện</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Thông tin người thực hiện</label>
                                <div class="card bg-light">
                                    <div class="card-body py-2">
                                        <small>
                                            <strong>User:</strong> <span id="currentUser">Đang tải...</span> | 
                                            <strong>Vai trò:</strong> <span id="currentRole">Đang tải...</span>
                                        </small>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg" id="submitBtn">
                                    <i class="fas fa-file-signature me-2"></i>
                                    Ký và ghi lên chuỗi
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                                    <i class="fas fa-arrow-left me-2"></i>
                                    Quay lại
                                </button>
                            </div>
                        </form>

                        <!-- Kết quả sau khi ghi -->
                        <div id="resultSection" class="mt-4" style="display: none;">
                            <div class="alert alert-success">
                                <h5><i class="fas fa-check-circle me-2"></i>Ghi nhận thành công!</h5>
                                <div id="resultDetails"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Lịch sử sự kiện -->
                <div class="card mt-4 shadow">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-history me-2"></i>
                            Lịch sử sự kiện sản phẩm
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="searchProductId" 
                                   placeholder="Nhập mã sản phẩm để xem lịch sử">
                            <button class="btn btn-primary" type="button" id="searchHistoryBtn">
                                <i class="fas fa-search me-1"></i>Tìm kiếm
                            </button>
                        </div>
                        <div id="historyResults"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/record-event.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
