<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Supply Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Dùng lại CSS của login.html */
        :root { --primary: #1a237e; --shadow: 0 4px 12px rgba(0,0,0,0.08); --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: white; border-radius: var(--radius); padding: 32px; width: 100%; max-width: 420px;
            box-shadow: var(--shadow);
        }
        .card h2 { text-align: center; color: var(--primary); margin-bottom: 24px; font-size: 1.8rem; font-weight: 600; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #374151; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; border: 1.5px solid #dee2e6; border-radius: 8px;
            font-size: 1rem; transition: all 0.2s; background: #fdfdff;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,35,126,0.15);
        }
        .btn {
            width: 100%; padding: 14px; background: var(--primary); color: white; border: none;
            border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 8px;
        }
        .message { margin: 16px 0; padding: 12px; border-radius: 8px; text-align: center; font-weight: 500; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: var(--primary); font-weight: 500; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Đăng ký tài khoản</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>Vai trò</label>
                <select id="role" required>
                    <option value="">-- Chọn vai trò --</option>
                    <option value="farmer">Nông dân</option>
                    <option value="shipper">Vận chuyển</option>
                    <option value="factory">Nhà máy</option>
                    <option value="retailer">Bán lẻ</option>
                </select>
            </div>
            <button type="submit" class="btn">Đăng ký</button>
        </form>
        <div id="message"></div>
        <div class="link">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
