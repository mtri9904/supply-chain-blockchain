<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy xuất nguồn gốc - Supply Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a237e; --primary-hover: #283593; --success: #4caf50; --danger: #f44336;
            --light: #f8f9fa; --gray: #6c757d; --border: #dee2e6; --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 12px; --transition: all 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background: #f6f9fe; color: #253354;
            min-height: 100vh; line-height: 1.6; margin: 0;
            display: flex; flex-direction: column;
        }
        .main-content { flex: 1; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .navbar {
            background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 16px 0;
            position: sticky; top: 0; z-index: 100;
        }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--primary); font-size: 1.3rem; }
        .brand img { width: 46px; height: 46px; border-radius: 12px; }
        .auth-buttons { display: flex; gap: 12px; }
        .btn {
            padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: var(--transition); font-size: 0.95rem; border: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn:hover { transform: translateY(-1px); }

        .hero { text-align: center; padding: 60px 20px; }
        .hero h1 { font-size: 2.2rem; color: var(--primary); margin-bottom: 16px; font-weight: 700; }
        .hero p { color: var(--gray); max-width: 600px; margin: 0 auto 32px; }

        .search-card {
            max-width: 500px; margin: 0 auto; background: white; border-radius: var(--radius);
            padding: 28px; box-shadow: var(--shadow);
        }
        .search-card h2 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 1.3rem; }
        .search-form { display: flex; gap: 0; border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .search-form input {
            flex: 1; padding: 16px; border: none; font-size: 1.1rem; background: #f7faff;
        }
        .search-form button {
            background: var(--primary); color: white; padding: 0 32px; font-weight: 600;
            border: none; cursor: pointer;
        }

        .result-section { margin-top: 40px; }
        .result-title { text-align: center; color: var(--primary); font-weight: 600; margin: 24px 0 16px; }

        /* Timeline Item */
        .timeline-item {
            background: #f8fdff; border-left: 4px solid var(--primary); padding: 18px;
            border-radius: 10px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Giai đoạn */
        .stage-header {
            margin: 24px 0 12px; padding: 12px 16px; background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: white; border-radius: 8px; font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;
        }

        /* Mỗi dòng thông tin có icon */
        .info-line {
            display: flex; align-items: flex-start; gap: 10px; margin: 6px 0; font-size: 0.95rem;
        }
        .info-line i {
            color: var(--primary); width: 18px; text-align: center; font-size: 0.9rem; margin-top: 2px;
        }
        .info-line strong { color: #1a237e; min-width: 120px; }

        .footer {
            text-align: center; padding: 32px 20px; color: var(--gray); font-size: 0.9rem;
            background: rgba(255,255,255,0.8); border-top: 1px solid #eee;
        }

        @media (max-width: 600px) {
            .search-form { flex-direction: column; }
            .search-form button { padding: 16px; }
            .info-line { flex-direction: column; gap: 4px; }
            .info-line strong { min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="container">
            <div class="brand">
                <img src="https://cdn-icons-png.flaticon.com/512/3877/3877569.png" alt="Logo">
                <span>Truy xuất nguồn gốc</span>
            </div>
            <div class="auth-buttons" id="authButtons">
                <button class="btn btn-outline" onclick="location.href='login.html'">Đăng nhập</button>
                <button class="btn btn-outline" onclick="location.href='register.html'">Đăng ký</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="hero">
            <h1>Xác thực nguồn gốc – Minh bạch chuỗi cung ứng</h1>
            <p>Tra cứu hành trình sản phẩm từ nông trại đến tay người tiêu dùng bằng công nghệ Blockchain.</p>
        </div>

        <div class="container">
            <div class="search-card">
                <h2>Tra cứu lô hàng</h2>
                <form id="searchForm" class="search-form">
                    <input type="text" id="batchNumber" placeholder="Nhập Batch Number (VD: BATCH-123)" required>
                    <button type="submit">Tra cứu</button>
                </form>
                <p style="text-align:center;font-size:0.9rem;color:#666;margin-top:12px;">
                    Ví dụ: <strong>BATCH-8679983269111</strong>
                </p>
            </div>

            <div class="result-section">
                <div id="result" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        © 2025 Supply Chain Blockchain | Hỗ trợ: 1900-9999
    </div>

    <script src="js/config.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (token && user.username) {
            document.getElementById('authButtons').innerHTML = `
                <span style="color:var(--primary);font-weight:600;margin-right:12px;">${user.username}</span>
                <button class="btn btn-primary" onclick="location.href='dashboard.html'">Dashboard</button>
                <button class="btn btn-outline" onclick="logout()">Đăng xuất</button>
            `;
        }
        function logout() {
            if (confirm('Đăng xuất?')) {
                localStorage.removeItem('token'); localStorage.removeItem('user');
                location.reload();
            }
        }

        // Dịch trạng thái
        function translateStatus(status) {
            const map = { 'pickup': 'Đã lấy hàng', 'intransit': 'Đang vận chuyển', 'delivered': 'Đã giao hàng' };
            return map[status] || status;
        }

        // Dịch loại khách hàng
        function translateCustomerType(type) {
            const map = {
                'individual': 'Cá nhân',
                'business': 'Doanh nghiệp',
                'wholesale': 'Bán buôn',
                'retail': 'Bán lẻ',
                'export': 'Xuất khẩu'
            };
            return map[type] || type;
        }

        // Hàm tạo dòng có icon
        function makeInfo(icon, label, value) {
            if (!value && value !== 0) return '';
            return `<div class="info-line">
                <i class="${icon}"></i>
                <div><strong>${label}:</strong> ${value}</div>
            </div>`;
        }

        // Tạo tiêu đề giai đoạn
        function makeStageHeader(icon, title) {
            return `<div class="stage-header">
                <i class="fas ${icon}"></i> ${title}
            </div>`;
        }

        // Định dạng từng bước theo giai đoạn
        function formatHistoryByStages(data) {
            let html = '';

            // Giai đoạn 1: Thu hoạch (Farmer)
            const farmerStage = data.filter(item => item.role === 'farmer');
            if (farmerStage.length > 0) {
                html += makeStageHeader('fa-seedling', 'GIAI ĐOẠN 1: THU HOẠCH');
                farmerStage.forEach(item => {
                    html += formatSingleStep(item, 'farmer');
                });
            }

            // Giai đoạn 2: Vận chuyển (Shipper)
            const shipperStage = data.filter(item => item.role === 'shipper');
            if (shipperStage.length > 0) {
                html += makeStageHeader('fa-truck', 'GIAI ĐOẠN 2: VẬN CHUYỂN');
                shipperStage.forEach(item => {
                    html += formatSingleStep(item, 'shipper');
                });
            }

            // Giai đoạn 3: Sản xuất (Factory)
            const factoryStage = data.filter(item => item.role === 'factory');
            if (factoryStage.length > 0) {
                html += makeStageHeader('fa-cogs', 'GIAI ĐOẠN 3: SẢN XUẤT');
                factoryStage.forEach(item => {
                    html += formatSingleStep(item, 'factory');
                });
            }

            // Giai đoạn 4: Bán hàng (Retailer)
            const retailerStage = data.filter(item => item.role === 'retailer');
            if (retailerStage.length > 0) {
                html += makeStageHeader('fa-store-alt', 'GIAI ĐOẠN 4: BÁN HÀNG');
                retailerStage.forEach(item => {
                    html += formatSingleStep(item, 'retailer');
                });
            }

            return html || '<div style="text-align:center;color:#666;padding:20px;">Chưa có dữ liệu</div>';
        }

        // Format từng bước theo role
        function formatSingleStep(item, role) {
            let lines = [];

            lines.push(makeInfo('fas fa-calendar-alt', 'Thời gian', new Date(item.timestamp).toLocaleString('vi-VN')));
            lines.push(makeInfo('fas fa-map-marker-alt', 'Vị trí', item.location || 'Không xác định'));

            if (role === 'farmer') {
                if (item.productName) lines.push(makeInfo('fas fa-seedling', 'Sản phẩm', item.productName));
                if (item.quantity !== undefined) lines.push(makeInfo('fas fa-weight', 'Số lượng', `${item.quantity} kg`));
                if (item.quality) lines.push(makeInfo('fas fa-award', 'Chất lượng', `Loại ${item.quality.toUpperCase()}`));
            }

            if (role === 'shipper') {
                if (item.status) lines.push(makeInfo('fas fa-truck', 'Trạng thái', translateStatus(item.status)));
                if (item.fromLocation) lines.push(makeInfo('fas fa-arrow-up', 'Từ', item.fromLocation));
                if (item.toLocation) lines.push(makeInfo('fas fa-arrow-down', 'Đến', item.toLocation));
            }

            if (role === 'factory') {
                if (item.processType) {
                    const processMap = { 'cleaning': 'Làm sạch', 'roasting': 'Rang', 'grinding': 'Xay', 'packaging': 'Đóng gói' };
                    lines.push(makeInfo('fas fa-cogs', 'Quy trình', processMap[item.processType] || item.processType));
                }
            }

            if (role === 'retailer') {
                if (item.quantity !== undefined) lines.push(makeInfo('fas fa-weight-hanging', 'Số lượng bán', `${item.quantity} kg`));
                if (item.saleDate) lines.push(makeInfo('fas fa-calendar-check', 'Ngày bán', new Date(item.saleDate).toLocaleDateString('vi-VN')));
                if (item.price) lines.push(makeInfo('fas fa-money-bill-wave', 'Giá bán', `${parseInt(item.price).toLocaleString('vi-VN')} VNĐ/kg`));
                if (item.customerType) lines.push(makeInfo('fas fa-users', 'Loại khách hàng', translateCustomerType(item.customerType)));
            }

            lines.push(makeInfo('fas fa-user', 'Người thực hiện', item.actor));

            return `<div class="timeline-item">
                <div style="line-height:1.7;">${lines.join('')}</div>
            </div>`;
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const batchNumber = document.getElementById('batchNumber').value.trim();
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">Đang tìm kiếm trên Blockchain...</div>';

            try {
                const response = await fetch(`${window.API_URL}/api/history/${batchNumber}`);
                const data = await response.json();

                if (response.ok && data.length > 0) {
                    data.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                    
                    const html = `<div class="result-title">Lịch sử hoàn chỉnh lô hàng: <strong>${batchNumber}</strong></div>
                                 <div class="timeline">
                                    ${formatHistoryByStages(data)}
                                 </div>`;
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div style="text-align:center;color:#d32f2f;padding:40px;">
                        Không tìm thấy lô hàng <strong>${batchNumber}</strong><br>
                        <small style="color:#666;">Lô hàng có thể chưa được ghi nhận trên Blockchain</small>
                    </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="text-align:center;color:#d32f2f;padding:40px;">
                    Lỗi kết nối server: ${error.message}
                </div>`;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(location.search);
            const batch = params.get('batchNumber');
            if (batch) {
                document.getElementById('batchNumber').value = batch;
                document.getElementById('searchForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
