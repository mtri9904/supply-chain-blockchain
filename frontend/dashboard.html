<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Supply Chain Blockchain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: #1a237e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-info span {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 5px;
        }
        .user-info button {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #4caf50;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .input-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .input-section h2 {
            color: #1a237e;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-group textarea {
            height: 100px;
            resize: vertical;
        }
        .submit-btn {
            background: #1a237e;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .submit-btn:hover {
            background: #283593;
        }
        .history-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .timeline-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .timeline-content {
            flex: 1;
        }
        .timeline-qr {
            flex-shrink: 0;
            text-align: center;
        }
        .timeline-qr img {
            width: 120px;
            height: 120px;
            border: 2px solid #1a237e;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .timeline-qr img:hover {
            transform: scale(1.05);
        }
        .timeline-qr p {
            margin: 5px 0 0 0;
            font-size: 11px;
            color: #666;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            background: white;
            color: #1a237e;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-btn.active {
            background: #1a237e;
            color: white;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .qr-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .qr-modal.show {
            display: flex !important;
        }
        .qr-modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .qr-modal-content h2 {
            color: #1a237e;
            margin-bottom: 20px;
        }
        .qr-modal-content img {
            max-width: 100%;
            border: 3px solid #1a237e;
            border-radius: 10px;
            margin: 20px 0;
        }
        .qr-modal-content button {
            margin: 10px;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .qr-download-btn {
            background: #4caf50;
            color: white;
        }
        .qr-close-btn {
            background: #f44336;
            color: white;
        }
        .qr-product-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #666;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .timeline-status {
            font-weight: bold;
            color: #1a237e;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .timeline-info {
            margin-bottom: 5px;
            color: #555;
        }
        .form-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .dynamic-fields {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #1a237e;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>📦 Supply Chain Blockchain</h1>
        <div class="user-info">
            <span id="userRole">Loading...</span>
            <span id="userName">Loading...</span>
            <button onclick="location.href='index.html'">🏠 Trang chủ</button>
            <button onclick="logout()">Đăng xuất</button>
        </div>
    </div>

    <div class="container">
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showSection('input')">📝 Nhập liệu</button>
            <button class="nav-btn" onclick="showSection('history')">📋 Lịch sử</button>
            <button class="nav-btn" onclick="showBlockchainStats()">📊 Thống kê Blockchain</button>
            <button class="nav-btn" onclick="validateBlockchain(event)">🔍 Kiểm tra tính hợp lệ</button>
        </div>

        <div id="inputSection" class="input-section">
            <!-- Form sẽ được tạo động dựa vào role -->
        </div>

        <div id="historySection" class="history-section" style="display: none;">
            <h2>📋 Lịch sử cập nhật của bạn</h2>
            <div id="historyContent"></div>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <h2>📱 Mã QR Sản Phẩm</h2>
            <div class="qr-product-info">
                <p><strong>Tên sản phẩm:</strong> <span id="qrProductName"></span></p>
                <p><strong>Batch Number:</strong> <span id="qrBatchNumber"></span></p>
                <p><strong>Mã sản phẩm (cũ):</strong> <span id="qrProductId"></span></p>
                <p><strong>Block:</strong> #<span id="qrBlockIndex"></span></p>
                <p><strong>Hash:</strong> <code id="qrBlockHash" style="font-size: 11px;"></code></p>
            </div>
            <img id="qrCodeImage" src="" alt="QR Code">
            <p style="color: #666; font-size: 14px; margin: 10px 0;">
                📸 Quét mã QR này để xem lịch sử sản phẩm
            </p>
            <div>
                <button class="qr-download-btn" onclick="downloadQRCode()">💾 Tải xuống QR</button>
                <button class="qr-close-btn" onclick="closeQRModal()">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        // Sử dụng IP để điện thoại có thể kết nối
        // API_URL will be set by config.js
        let currentUser = null;
        const API_URL = window.API_URL || 'http://localhost:5000';

        // Kiểm tra đăng nhập
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            if (!token || !user.username) {
                location.href = 'login.html';
                return;
            }

            currentUser = user;
            document.getElementById('userName').textContent = `👤 ${user.username}`;
            document.getElementById('userRole').textContent = getRoleIcon(user.role) + ' ' + getRoleName(user.role);
            createFormForRole(user.role);
            loadUserHistory();
        }

        function getRoleIcon(role) {
            const icons = {
                'farmer': '🌾',
                'shipper': '🚚',
                'factory': '🏭',
                'retailer': '🏪'
            };
            return icons[role] || '👤';
        }

        function getRoleName(role) {
            const roles = {
                'farmer': 'Nông dân',
                'shipper': 'Vận chuyển',
                'factory': 'Nhà máy',
                'retailer': 'Bán lẻ'
            };
            return roles[role] || role;
        }

        async function ensureApiUrl() {
            if (window.API_URL) {
                return window.API_URL;
            }

            await new Promise(resolve => {
                const checkInterval = setInterval(() => {
                    if (window.API_URL) {
                        clearInterval(checkInterval);
                        resolve();
                    }
                }, 100);
            });

            return window.API_URL;
        }

        function createFormForRole(role) {
            const section = document.getElementById('inputSection');
            let formContent = '';

            // Fields chung cho mọi role
            const commonFields = `
                <div class="form-group">
                    <label for="batchNumber">Mã lô sản phẩm (Batch Number) *</label>
                    <input type="text" id="batchNumber" required placeholder="Dán Batch Number từ lịch sử (bấm nút Copy)">
                    <small style="color: #0277bd; font-size: 0.85em;">
                        💡 Tìm Batch Number trong phần "Lịch sử" bên dưới và bấm nút "📋 Copy"
                    </small>
                </div>
                <div class="form-group">
                    <label for="location">Địa điểm *</label>
                    <input type="text" id="location" required placeholder="Nhập địa điểm hiện tại">
                </div>
            `;

            switch(role) {
                case 'farmer':
                    formContent = `
                        <h2>🌾 Ghi nhận thông tin nông nghiệp</h2>
                        ${commonFields}
                        <h2>🌾 Ghi nhận thông tin thu hoạch</h2>
                        <div class="form-group">
                            <label for="productName">Tên sản phẩm *</label>
                            <input type="text" id="productName" required placeholder="VD: Cà phê Arabica, Gạo ST25">
                        </div>
                        <div class="form-group">
                            <label for="location">Địa điểm *</label>
                            <input type="text" id="location" required placeholder="Nhập địa điểm hiện tại">
                        </div>
                        <div class="form-group">
                            <label for="eventType">Loại sự kiện *</label>
                            <select id="eventType" required onchange="toggleFarmerFields()">
                                <option value="">-- Chọn sự kiện --</option>
                                <option value="planting">Trồng cây</option>
                                <option value="fertilizing">Bón phân</option>
                                <option value="watering">Tưới nước</option>
                                <option value="harvesting">Thu hoạch</option>
                                <option value="quality_check">Kiểm tra chất lượng</option>
                            </select>
                        </div>
                        
                        <!-- Dynamic fields based on event type -->
                        <div id="dynamicFields" class="dynamic-fields">
                            <!-- Fields sẽ được thay đổi dựa trên loại sự kiện -->
                            <div class="form-group">
                                <label for="harvestDate">Ngày thực hiện *</label>
                                <input type="date" id="harvestDate" required>
                            </div>
                            <div class="form-group">
                                <label for="quantity">Số lượng (kg) *</label>
                                <input type="number" id="quantity" required min="0" step="0.1">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="quality">Chất lượng</label>
                            <select id="quality">
                                <option value="A">Loại A - Cao cấp</option>
                                <option value="B">Loại B - Tiêu chuẩn</option>
                                <option value="C">Loại C - Thường</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="notes">Ghi chú chi tiết *</label>
                            <textarea id="notes" placeholder="Mô tả chi tiết sự kiện..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="imageUpload">Hình ảnh minh chứng (tùy chọn)</label>
                            <input type="file" id="imageUpload" accept="image/*">
                            <div class="form-text">Tải lên hình ảnh minh chứng cho sự kiện</div>
                        </div>
                    `;
                    break;

                case 'shipper':
                    formContent = `
                        <h2>🚚 Cập nhật vận chuyển & Logistics</h2>
                        ${commonFields}
                        <div class="form-group">
                            <label for="eventType">Loại sự kiện *</label>
                            <select id="eventType" required>
                            <label for="status">Trạng thái vận chuyển *</label>
                            <select id="status" required>
                                <option value="">-- Chọn trạng thái --</option>
                                <option value="pickup">Đã lấy hàng</option>
                                <option value="intransit">Đang vận chuyển</option>
                                <option value="warehouse">Nhập kho</option>
                                <option value="delivered">Đã giao hàng</option>
                                <option value="delay">Trì hoãn</option>
                            </select>
                            <small style="color: #666; font-size: 0.9em;">Mỗi lần thay đổi trạng thái sẽ tạo 1 block mới</small>
                        </div>
                        <div class="form-group">
                            <label for="fromLocation">Điểm đi *</label>
                            <input type="text" id="fromLocation" required>
                        </div>
                        <div class="form-group">
                            <label for="toLocation">Điểm đến *</label>
                            <input type="text" id="toLocation" required>
                        </div>
                        <div class="form-group">
                            <label for="temperature">Nhiệt độ (°C)</label>
                            <input type="number" id="temperature" step="0.1" placeholder="Nhiệt độ bảo quản">
                        </div>
                        <div class="form-group">
                            <label for="notes">Ghi chú vận chuyển *</label>
                            <textarea id="notes" placeholder="Mô tả tình trạng vận chuyển..." required></textarea>
                        </div>
                    `;
                    break;

                case 'factory':
                    formContent = `
                        <h2>🏭 Ghi nhận sản xuất & Chế biến</h2>
                        ${commonFields}
                        <div class="form-group">
                            <label for="eventType">Loại quy trình *</label>
                            <select id="eventType" required>
                                <option value="cleaning">Làm sạch</option>
                                <option value="sorting">Phân loại</option>
                                <option value="roasting">Rang xay</option>
                                <option value="grinding">Xay nghiền</option>
                                <option value="packaging">Đóng gói</option>
                                <option value="quality_control">Kiểm soát chất lượng</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="temperature">Nhiệt độ xử lý (°C)</label>
                            <input type="number" id="temperature" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="duration">Thời gian xử lý (phút)</label>
                            <input type="number" id="duration" min="0">
                        </div>
                        <div class="form-group">
                            <label for="notes">Ghi chú quy trình *</label>
                            <textarea id="notes" placeholder="Mô tả chi tiết quy trình sản xuất..." required></textarea>
                        </div>
                    `;
                    break;

                case 'retailer':
                    formContent = `
                        <h2>🏪 Ghi nhận bán hàng & Phân phối</h2>
                        ${commonFields}
                        <div class="form-group">
                            <label for="eventType">Loại sự kiện *</label>
                            <select id="eventType" required>
                                <option value="received">Nhập hàng</option>
                                <option value="sale">Bán hàng</option>
                                <option value="display">Trưng bày</option>
                                <option value="promotion">Khuyến mãi</option>
                                <option value="return">Hàng trả về</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="saleDate">Ngày *</label>
                            <input type="date" id="saleDate" required>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Số lượng (kg) *</label>
                            <input type="number" id="quantity" required min="0" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="price">Giá (VNĐ/kg)</label>
                            <input type="number" id="price" min="0" placeholder="Giá bán hoặc nhập">
                        </div>
                        <div class="form-group">
                            <label for="customerType">Loại khách hàng</label>
                            <select id="customerType">
                                <option value="individual">Cá nhân</option>
                                <option value="business">Doanh nghiệp</option>
                                <option value="wholesale">Bán sỉ</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="notes">Ghi chú *</label>
                            <textarea id="notes" placeholder="Mô tả chi tiết sự kiện..." required></textarea>
                        </div>
                    `;
                    break;
            }

            formContent += `
                <div class="form-group" style="margin-top: 20px; padding: 15px; background: #e8f5e8; border-radius: 5px;">
                    <label style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="agreeBlockchain" required>
                        <span>✅ Tôi đồng ý ghi dữ liệu này lên blockchain - dữ liệu sẽ không thể thay đổi sau khi ghi</span>
                    </label>
                </div>
                <button type="button" class="submit-btn" onclick="submitEventForm()">
                    🔐 Ký & Ghi lên Blockchain
                </button>
            `;

            function setupImagePreview() {
                const imageInput = document.getElementById('imageUpload');
                if (imageInput) {
                    imageInput.addEventListener('change', function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            // Tạo preview
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                // Xóa preview cũ nếu có
                                const oldPreview = document.getElementById('imagePreview');
                                if (oldPreview) oldPreview.remove();
                                
                                // Tạo preview mới
                                const preview = document.createElement('div');
                                preview.id = 'imagePreview';
                                preview.innerHTML = `
                                    <div style="margin-top: 10px; text-align: center;">
                                        <img src="${e.target.result}" 
                                            style="max-width: 200px; max-height: 200px; border-radius: 5px; border: 2px solid #1a237e;">
                                        <br>
                                        <button type="button" onclick="removeImage()" 
                                            style="margin-top: 5px; padding: 5px 10px; background: #f44336; color: white; border: none; border-radius: 3px; cursor: pointer;">
                                            ❌ Xóa ảnh
                                        </button>
                                    </div>
                                `;
                                imageInput.parentNode.appendChild(preview);
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                }
            }

            section.innerHTML = formContent;
            
            // Set default date to today
            const dateField = document.getElementById('harvestDate') || document.getElementById('saleDate');
            if (dateField) {
                dateField.valueAsDate = new Date();
            }
            setTimeout(setupImagePreview, 100);
        }

        // Dynamic form fields for farmer
        function toggleFarmerFields() {
            const eventType = document.getElementById('eventType').value;
            const dynamicFields = document.getElementById('dynamicFields');
            
            if (!dynamicFields) return;
            
            let fieldsHTML = '';
            
            switch(eventType) {
                case 'planting':
                    fieldsHTML = `
                        <div class="form-group">
                            <label for="harvestDate">Ngày trồng *</label>
                            <input type="date" id="harvestDate" required>
                        </div>
                        <div class="form-group">
                            <label for="seedType">Loại giống</label>
                            <input type="text" id="seedType" placeholder="Loại giống sử dụng">
                        </div>
                        <div class="form-group">
                            <label for="area">Diện tích (m²)</label>
                            <input type="number" id="area" min="0" step="0.1">
                        </div>
                    `;
                    break;
                    
                case 'fertilizing':
                    fieldsHTML = `
                        <div class="form-group">
                            <label for="harvestDate">Ngày bón phân *</label>
                            <input type="date" id="harvestDate" required>
                        </div>
                        <div class="form-group">
                            <label for="fertilizerType">Loại phân bón</label>
                            <input type="text" id="fertilizerType" placeholder="Loại phân bón sử dụng">
                        </div>
                        <div class="form-group">
                            <label for="quantity">Lượng phân (kg) *</label>
                            <input type="number" id="quantity" required min="0" step="0.1">
                        </div>
                    `;
                    break;
                    
                case 'watering':
                    fieldsHTML = `
                        <div class="form-group">
                            <label for="harvestDate">Ngày tưới *</label>
                            <input type="date" id="harvestDate" required>
                        </div>
                        <div class="form-group">
                            <label for="waterSource">Nguồn nước</label>
                            <input type="text" id="waterSource" placeholder="Nguồn nước sử dụng">
                        </div>
                        <div class="form-group">
                            <label for="duration">Thời gian tưới (phút)</label>
                            <input type="number" id="duration" min="0">
                        </div>
                    `;
                    break;
                    
                case 'harvesting':
                    fieldsHTML = `
                        <div class="form-group">
                            <label for="harvestDate">Ngày thu hoạch *</label>
                            <input type="date" id="harvestDate" required>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Số lượng thu hoạch (kg) *</label>

        function copyBatchNumber(batchNumber) {

        // ========== HÀM KÝ DỮ LIỆU BẰNG PRIVATE KEY ==========
        function signData(data) {
            const privateKeyPEM = localStorage.getItem('privateKey');
            const user = JSON.parse(localStorage.getItem('user'));
            
            if (!privateKeyPEM || !user || !user.publicKey) {
                console.warn('⚠️ Không có private key hoặc public key. Không ký được giao dịch.');
                return null;
            }
            
            try {
                // Sử dụng jsrsasign để ký
                const sig = new KJUR.crypto.Signature({alg: "SHA256withRSA"});
                sig.init(privateKeyPEM);
                sig.updateString(JSON.stringify(data, Object.keys(data).sort()));
                const signature = sig.sign();
                
                console.log('✅ Đã ký giao dịch thành công');
                return signature; // Hex string
            } catch (error) {
                console.error('❌ Lỗi khi ký dữ liệu:', error);
                return null;
            }
        }

                await ensureApiUrl();

                const response = await fetch(`${window.API_URL}/api/blockchain/stats`);

                    let signatureInfo = '';
                    if (stats.signedBlocks !== undefined) {
                        signatureInfo = `\n\n🔐 CHỮ KÝ SỐ:\n` +
                                      `- Block có chữ ký: ${stats.signedBlocks}\n` +
                                      `- Block chưa ký: ${stats.unsignedBlocks}\n` +
                                      `- Tỷ lệ bảo mật: ${stats.signaturePercentage}%`;
                    }
                    
                    alert(`📊 THỐNG KÊ BLOCKCHAIN\n\n` +
                          `Tổng số Block: ${stats.totalBlocks}\n` +
                          `Độ khó Mining: ${stats.difficulty} (${stats.difficulty} chữ số 0)\n` +
                          `Giao dịch đang chờ: ${stats.pendingTransactions}\n` +
                          `Trạng thái: ${validText}` +
                          signatureInfo +
                          `\n\nBLOCK MỚI NHẤT:\n` +
                          `- Index: #${stats.latestBlock.index}\n` +
                          `- Hash: ${stats.latestBlock.hash.substring(0, 20)}...\n` +
                          `- Thời gian: ${new Date(stats.latestBlock.timestamp).toLocaleString('vi-VN')}`);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert(`❌ Lỗi lấy thống kê: ${error.message}`);
            }
        }
        
        // Validate blockchain
        async function validateBlockchain(event) {
            try {
                await ensureApiUrl();

                const confirmValidate = confirm('🔍 Xác thực blockchain sẽ kiểm tra:\n' +
                                               '• Tính toàn vẹn của mỗi block\n' +
                                               '• Liên kết giữa các block\n' +
                                               '• Proof of Work (PoW)\n' +
                                               '• Chữ ký số (Digital Signature)\n\n' +
                                               'Tiếp tục?');
                
                if (!confirmValidate) return;
                
                // Show loading
                let button = null;
                if (event && event.target) {
                    button = event.target;
                    button.textContent = '⏳ Đang kiểm tra...';
                    button.disabled = true;
                }
                
                const response = await fetch(`${API_URL}/api/blockchain/validate`);
                const result = await response.json();
                const stats = result.stats || {};
                
                // Restore button
                if (button) {
                    button.textContent = '🔍 Kiểm tra tính hợp lệ';
                    button.disabled = false;
                }
                
                if (result.success) {
                    const icon = result.isValid ? '✅' : '❌';
                    const message = result.message;
                    
                    // ========== THÊM THÔNG TIN CHỮ KÝ SỐ ==========
                    let signatureInfo = '';
                    if (typeof stats.verifiedSignatures === 'number') {
                        signatureInfo = `\n\n🔐 KIỂM TRA CHỮ KÝ SỐ:\n` +
                                      `✅ Chữ ký hợp lệ: ${stats.verifiedSignatures}\n` +
                                      `❌ Chữ ký không hợp lệ: ${stats.invalidSignatures ?? 'Không rõ'}`;

                        if (Array.isArray(stats.signatureWarnings) && stats.signatureWarnings.length > 0) {
                            const warningLines = stats.signatureWarnings.slice(0, 3).map(w => `• ${w}`);
                            signatureInfo += `\n\n⚠️ CẢNH BÁO:\n` + warningLines.join('\n');
                            if (stats.signatureWarnings.length > 3) {
                                signatureInfo += `\n... và ${stats.signatureWarnings.length - 3} cảnh báo khác`;
                            }
                        }
                    }
                    
                    alert(`${icon} KẾT QUẢ XÁC THỰC\n\n` +
                          `${message}\n\n` +
                          `📊 THỐNG KÊ:\n` +
                          `Tổng số block: ${stats.totalBlocks ?? 'Không rõ'}\n` +
                          `Độ khó: ${stats.difficulty ?? 'Không rõ'}\n` +
                          (stats.latestBlockHash ? `Latest Hash: ${stats.latestBlockHash.substring(0, 20)}...` : 'Latest Hash: Không rõ') +
                          signatureInfo);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert(`❌ Lỗi xác thực: ${error.message}`);
                // Restore button on error
                if (event && event.target) {
                    event.target.textContent = '🔍 Kiểm tra tính hợp lệ';
                    event.target.disabled = false;
                }
            }
        }

        // Tải xuống QR Code
        function downloadQRCode() {
            const qrImage = document.getElementById('qrCodeImage');
            const batchNumber = document.getElementById('qrBatchNumber')?.textContent || 'batch';
            
            // Tạo link download
            const link = document.createElement('a');
            link.href = qrImage.src;
            link.download = `QR_${batchNumber.replace(/\s+/g, '_')}.png`;
            link.click();
            
            setTimeout(() => {
                const confirmed = confirm('✅ Đã tải xuống mã QR!\n\nĐóng cửa sổ này?');
                if (confirmed) {
                    closeQRModal();
                }
            }, 300);
        }
        // Đóng modal khi click bên ngoài
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('qrModal');
            if (event.target === modal && modal.classList.contains('show')) {
                closeQRModal();
            }
        });
        
        // Ngăn modal đóng khi click vào nội dung modal
        const modalContent = document.querySelector('.qr-modal-content');
        if (modalContent) {
            modalContent.addEventListener('click', function(event) {
                event.stopPropagation();
            });
        }


        // Hàm cập nhật trạng thái vận chuyển
        async function updateShippingStatus(batchNumber, newStatus, fromLocation, toLocation) {
            const statusVNMap = {
                'pickup': 'Đã lấy hàng',
                'intransit': 'Đang vận chuyển',
                'delivered': 'Đã giao hàng'
            };
            
            if (!confirm(`Xác nhận cập nhật trạng thái sang "${statusVNMap[newStatus]}"?`)) return;
            
            // Disable tất cả các nút cập nhật
            const updateBtns = document.querySelectorAll('.update-status-btn');
            updateBtns.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.textContent = '⏳ Đang cập nhật...';
            });
            
            try {
                const formData = {
                    batchNumber: batchNumber,
                    status: newStatus,
                    fromLocation: fromLocation,
                    toLocation: toLocation,
                    location: toLocation,
                    actor: currentUser.username,
                    role: currentUser.role
                };
                
                // ========== KÝ GIAO DỊCH ==========
                const user = JSON.parse(localStorage.getItem('user'));
                const signature = signData(formData);
                
                const payload = {
                    data: formData,
                    signature: signature,
                    publicKey: user ? user.publicKey : null
                };
                
                const response = await fetch(`${window.API_URL}/api/record`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    alert(`❌ Lỗi: ${data.message || 'Không thể cập nhật'}`);
                    return;
                }
                
                alert(`✅ Đã cập nhật thành công sang "${statusVNMap[newStatus]}"!`);
                loadUserHistory();
            } catch (error) {
                alert(`❌ Lỗi: ${error.message}`);
                // Re-enable nút nếu có lỗi
                updateBtns.forEach(btn => {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                });
            }
        }
