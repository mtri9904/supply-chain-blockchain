<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Supply Chain Blockchain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: #1a237e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-info span {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 5px;
        }
        .user-info button {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #4caf50;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .input-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .input-section h2 {
            color: #1a237e;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-group textarea {
            height: 100px;
            resize: vertical;
        }
        .submit-btn {
            background: #1a237e;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .submit-btn:hover {
            background: #283593;
        }
        .history-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .timeline-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .timeline-content {
            flex: 1;
        }
        .timeline-qr {
            flex-shrink: 0;
            text-align: center;
        }
        .timeline-qr img {
            width: 120px;
            height: 120px;
            border: 2px solid #1a237e;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .timeline-qr img:hover {
            transform: scale(1.05);
        }
        .timeline-qr p {
            margin: 5px 0 0 0;
            font-size: 11px;
            color: #666;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            background: white;
            color: #1a237e;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-btn.active {
            background: #1a237e;
            color: white;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .qr-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .qr-modal.show {
            display: flex !important;
        }
        .qr-modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .qr-modal-content h2 {
            color: #1a237e;
            margin-bottom: 20px;
        }
        .qr-modal-content img {
            max-width: 100%;
            border: 3px solid #1a237e;
            border-radius: 10px;
            margin: 20px 0;
        }
        .qr-modal-content button {
            margin: 10px;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .qr-download-btn {
            background: #4caf50;
            color: white;
        }
        .qr-close-btn {
            background: #f44336;
            color: white;
        }
        .qr-product-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>📦 Supply Chain Blockchain</h1>
        <div class="user-info">
            <span id="userRole">Loading...</span>
            <span id="userName">Loading...</span>
            <button onclick="location.href='index.html'">🏠 Trang chủ</button>
            <button onclick="logout()">Đăng xuất</button>
        </div>
    </div>

    <div class="container">
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showSection('input')">📝 Nhập liệu</button>
            <button class="nav-btn" onclick="showSection('history')">📋 Lịch sử</button>
            <button class="nav-btn" onclick="showBlockchainStats()">📊 Thống kê Blockchain</button>
            <button class="nav-btn" onclick="validateBlockchain(event)">🔍 Kiểm tra tính hợp lệ</button>
        </div>

        <div id="inputSection" class="input-section">
            <!-- Form sẽ được tạo động dựa vào role -->
        </div>

        <div id="historySection" class="history-section" style="display: none;">
            <h2>📋 Lịch sử cập nhật của bạn</h2>
            <div id="historyContent"></div>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <h2>📱 Mã QR Sản Phẩm</h2>
            <div class="qr-product-info">
                <p><strong>Tên sản phẩm:</strong> <span id="qrProductName"></span></p>
                <p><strong>Batch Number:</strong> <span id="qrBatchNumber"></span></p>
                <p><strong>Mã sản phẩm (cũ):</strong> <span id="qrProductId"></span></p>
                <p><strong>Block:</strong> #<span id="qrBlockIndex"></span></p>
                <p><strong>Hash:</strong> <code id="qrBlockHash" style="font-size: 11px;"></code></p>
            </div>
            <img id="qrCodeImage" src="" alt="QR Code">
            <p style="color: #666; font-size: 14px; margin: 10px 0;">
                📸 Quét mã QR này để xem lịch sử sản phẩm
            </p>
            <div>
                <button class="qr-download-btn" onclick="downloadQRCode()">💾 Tải xuống QR</button>
                <button class="qr-close-btn" onclick="closeQRModal()">Đóng</button>
            </div>
        </div>
    </div>


    <script>
        // Sử dụng IP để điện thoại có thể kết nối
        // API_URL will be set by config.js
        let currentUser = null;

        // Kiểm tra đăng nhập
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            if (!token || !user.username) {
                location.href = 'login.html';
                return;
            }

            currentUser = user;
            document.getElementById('userName').textContent = `👤 ${user.username}`;
            document.getElementById('userRole').textContent = getRoleIcon(user.role) + ' ' + getRoleName(user.role);
            createFormForRole(user.role);
            loadUserHistory();
        }

        function getRoleIcon(role) {
            const icons = {
                'farmer': '🌾',
                'shipper': '🚚',
                'factory': '🏭',
                'retailer': '🏪'
            };
            return icons[role] || '👤';
        }

        function getRoleName(role) {
            const roles = {
                'farmer': 'Nông dân',
                'shipper': 'Vận chuyển',
                'factory': 'Nhà máy',
                'retailer': 'Bán lẻ'
            };
            return roles[role] || role;
        }

        async function ensureApiUrl() {
            if (window.API_URL) {
                return window.API_URL;
            }

            await new Promise(resolve => {
                const checkInterval = setInterval(() => {
                    if (window.API_URL) {
                        clearInterval(checkInterval);
                        resolve();
                    }
                }, 100);
            });

            return window.API_URL;
        }

        function createFormForRole(role) {
            const section = document.getElementById('inputSection');
            let formContent = '';

            // Fields chung cho mọi role
            const commonFields = `
                <div class="form-group">
                    <label for="batchNumber">Mã lô sản phẩm (Batch Number) *</label>
                    <input type="text" id="batchNumber" required placeholder="Dán Batch Number từ lịch sử (bấm nút Copy)">
                    <small style="color: #0277bd; font-size: 0.85em;">
                        💡 Tìm Batch Number trong phần "Lịch sử" bên dưới và bấm nút "📋 Copy"
                    </small>
                </div>
                <div class="form-group">
                    <label for="location">Địa điểm *</label>
                    <input type="text" id="location" required placeholder="Nhập địa điểm hiện tại">
                </div>
            `;

            switch(role) {
                case 'farmer':
                    formContent = `
                        <h2>🌾 Ghi nhận thông tin thu hoạch</h2>
                        <div class="form-group">
                            <label for="productName">Tên sản phẩm *</label>
                            <input type="text" id="productName" required placeholder="VD: Cà phê Arabica, Gạo ST25">
                        </div>
                        <div class="form-group">
                            <label for="location">Địa điểm *</label>
                            <input type="text" id="location" required placeholder="Nhập địa điểm hiện tại">
                        </div>
                        <div class="form-group">
                            <label for="harvestDate">Ngày thu hoạch *</label>
                            <input type="date" id="harvestDate" required>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Số lượng (kg) *</label>
                            <input type="number" id="quantity" required min="0" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="quality">Chất lượng</label>
                            <select id="quality" required>
                                <option value="A">Loại A - Cao cấp</option>
                                <option value="B">Loại B - Tiêu chuẩn</option>
                                <option value="C">Loại C - Thường</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="notes">Ghi chú</label>
                            <textarea id="notes" placeholder="Thông tin thêm về lô hàng..."></textarea>
                        </div>
                    `;
                    break;

                case 'shipper':
                    formContent = `
                        <h2>🚚 Cập nhật vận chuyển</h2>
                        ${commonFields}
                        <div class="form-group">
                            <label for="status">Trạng thái vận chuyển *</label>
                            <select id="status" required>
                                <option value="">-- Chọn trạng thái --</option>
                                <option value="pickup">Đã lấy hàng</option>
                                <option value="intransit">Đang vận chuyển</option>
                                <option value="delivered">Đã giao hàng</option>
                            </select>
                            <small style="color: #666; font-size: 0.9em;">Mỗi lần thay đổi trạng thái sẽ tạo 1 block mới</small>
                        </div>
                        <div class="form-group">
                            <label for="fromLocation">Điểm lấy hàng *</label>
                            <input type="text" id="fromLocation" required>
                        </div>
                        <div class="form-group">
                            <label for="toLocation">Điểm giao hàng *</label>
                            <input type="text" id="toLocation" required>
                        </div>
                        <div class="form-group">
                            <label for="temperature">Nhiệt độ (°C)</label>
                            <input type="number" id="temperature" step="0.1">
                        </div>
                    `;
                    break;

                case 'factory':
                    formContent = `
                        <h2>🏭 Ghi nhận sản xuất</h2>
                        ${commonFields}
                        <div class="form-group">
                            <label for="processType">Loại quy trình *</label>
                            <select id="processType" required>
                                <option value="cleaning">Làm sạch</option>
                                <option value="roasting">Rang</option>
                                <option value="grinding">Xay</option>
                                <option value="packaging">Đóng gói</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="temperature">Nhiệt độ xử lý (°C)</label>
                            <input type="number" id="temperature" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="duration">Thời gian xử lý (phút)</label>
                            <input type="number" id="duration" min="0">
                        </div>
                    `;
                    break;

                case 'retailer':
                    formContent = `
                        <h2>🏪 Ghi nhận bán hàng</h2>
                        ${commonFields}
                        <div class="form-group">
                            <label for="saleDate">Ngày bán *</label>
                            <input type="date" id="saleDate" required>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Số lượng bán (kg) *</label>
                            <input type="number" id="quantity" required min="0" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="price">Giá bán (VNĐ/kg) *</label>
                            <input type="number" id="price" required min="0">
                        </div>
                        <div class="form-group">
                            <label for="customerType">Loại khách hàng</label>
                            <select id="customerType">
                                <option value="individual">Cá nhân</option>
                                <option value="business">Doanh nghiệp</option>
                            </select>
                        </div>
                    `;
                    break;
            }

            formContent += `
                <button type="submit" class="submit-btn" onclick="submitForm()">
                    💾 Lưu thông tin
                </button>
            `;

            section.innerHTML = formContent;
        }

        function showSection(sectionName) {
            document.getElementById('inputSection').style.display = 
                sectionName === 'input' ? 'block' : 'none';
            document.getElementById('historySection').style.display = 
                sectionName === 'history' ? 'block' : 'none';

            // Update active button
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(sectionName === 'input' ? 'Nhập liệu' : 'Lịch sử')) {
                    btn.classList.add('active');
                }
            });
        }


        // ========== HÀM COPY BATCH NUMBER ==========
        function copyBatchNumber(batchNumber) {
            navigator.clipboard.writeText(batchNumber).then(() => {
                alert(`✅ Đã copy Batch Number:\n${batchNumber}`);
            }).catch(err => {
                console.error('❌ Lỗi copy:', err);
                // Fallback cho trình duyệt cũ
                const textarea = document.createElement('textarea');
                textarea.value = batchNumber;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert(`✅ Đã copy Batch Number:\n${batchNumber}`);
            });
        }

        // ========== HÀM KÝ DỮ LIỆU BẰNG PRIVATE KEY ==========
        function signData(data) {
            const privateKeyPEM = localStorage.getItem('privateKey');
            const user = JSON.parse(localStorage.getItem('user'));
            
            if (!privateKeyPEM || !user || !user.publicKey) {
                console.warn('⚠️ Không có private key hoặc public key. Không ký được giao dịch.');
                return null;
            }
            
            try {
                // Sử dụng jsrsasign để ký
                const sig = new KJUR.crypto.Signature({alg: "SHA256withRSA"});
                sig.init(privateKeyPEM);
                sig.updateString(JSON.stringify(data, Object.keys(data).sort()));
                const signature = sig.sign();
                
                console.log('✅ Đã ký giao dịch thành công');
                return signature; // Hex string
            } catch (error) {
                console.error('❌ Lỗi khi ký dữ liệu:', error);
                return null;
            }
        }

        async function submitForm() {
            // Disable nút submit để tránh double-click
            const submitBtn = document.querySelector('.submit-btn');
            if (submitBtn.disabled) {
                console.log('⚠️ Đang xử lý, vui lòng đợi...');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.6';
            submitBtn.style.cursor = 'not-allowed';
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '⏳ Đang xử lý...';
            
            try {
                const formData = {};
                const inputs = document.querySelectorAll('#inputSection input, #inputSection select, #inputSection textarea');
                inputs.forEach(input => {
                    if (input.value) {
                        formData[input.id] = input.value;
                    }
                });

                formData.actor = currentUser.username;
                formData.role = currentUser.role;
                
                // Validate shipper status
                if (currentUser.role === 'shipper' && !formData.status) {
                    alert('⚠️ Vui lòng chọn trạng thái vận chuyển!');
                    return;
                }

                // ========== KÝ GIAO DỊCH ==========
                const user = JSON.parse(localStorage.getItem('user'));
                const signature = signData(formData);
                
                const payload = {
                    data: formData,
                    signature: signature,
                    publicKey: user ? user.publicKey : null
                };

                const response = await fetch(`${window.API_URL}/api/record`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(payload)
                });

                console.log('📡 Response status:', response.status);
                console.log('📡 Response headers:', response.headers);
                
                if (!response.ok) {
                    // Xử lý lỗi HTTP
                    let errorMessage = `HTTP ${response.status}: `;
                    try {
                        const errorData = await response.json();
                        errorMessage += errorData.message || 'Có lỗi xảy ra';
                        if (errorData.hint) {
                            errorMessage += '\n\n💡 Gợi ý: ' + errorData.hint;
                        }
                        if (errorData.action) {
                            errorMessage += '\n\n📌 Hành động: ' + errorData.action;
                        }
                        if (errorData.debug) {
                            console.log('🔍 Debug info:', errorData.debug);
                        }
                    } catch (parseError) {
                        errorMessage += 'Không thể parse response';
                    }
                    throw new Error(errorMessage);
                }

                const data = await response.json();
                
                console.log('📡 Response từ server:', data);
                console.log('🔍 Có QR Code?', !!data.data?.qrCode);
                console.log('👤 User role:', currentUser.role);
                
                // Hiển thị thông báo thành công (cho tất cả role)
                if (data.data && data.data.qrCode) {
                    alert('✅ Thông tin đã được ghi nhận thành công!\n📱 QR Code đã được tạo và lưu vào lịch sử.');
                } else {
                    alert('✅ Thông tin đã được ghi nhận thành công!');
                }
                
                // Reset form và reload history
                loadUserHistory();
                inputs.forEach(input => {
                    if (input.type !== 'select-one') {
                        input.value = '';
                    }
                });
            } catch (error) {
                console.error('❌ Submit error:', error);
                
                // Xử lý các loại lỗi khác nhau
                let errorMessage = '';
                if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
                    errorMessage = '❌ Lỗi kết nối server!\n\n' +
                                 '🔍 Kiểm tra:\n' +
                                 '• Server có đang chạy không?\n' +
                                 '• URL server có đúng không?\n' +
                                 '• Có lỗi CORS không?\n\n' +
                                 '📌 Thử:\n' +
                                 '• Refresh trang\n' +
                                 '• Kiểm tra console để xem chi tiết lỗi';
                } else if (error.name === 'SyntaxError') {
                    errorMessage = '❌ Lỗi parse dữ liệu từ server!\n\n' +
                                 'Server trả về dữ liệu không đúng định dạng JSON.';
                } else {
                    errorMessage = `❌ Lỗi: ${error.message}`;
                }
                
                alert(errorMessage);
            } finally {
                // Re-enable nút submit
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                    submitBtn.textContent = originalText;
                }
            }
        }

        async function loadUserHistory() {
            const historyContent = document.getElementById('historyContent');
            historyContent.innerHTML = '<div class="loading">⏳ Đang tải lịch sử...</div>';

            try {
                await ensureApiUrl();

                console.log('Loading history with API URL:', window.API_URL);
                const response = await fetch(`${window.API_URL}/api/user-history/${currentUser.username}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error('Non-JSON response:', text);
                    throw new Error(`Server trả về HTML thay vì JSON. Status: ${response.status}. Response: ${text.substring(0, 200)}...`);
                }

                const data = await response.json();

                if (response.ok) {
                    if (!data || data.length === 0) {
                        historyContent.innerHTML = `
                            <div class="empty-message">
                                ℹ️ Chưa có lịch sử cập nhật nào.
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    
                    // Map trạng thái sang tiếng Việt
                    const statusVNMap = {
                        'pickup': 'Đã lấy hàng',
                        'intransit': 'Đang vận chuyển',
                        'delivered': 'Đã giao hàng'
                    };
                    
                    data.forEach((item, index) => {
                        const timestamp = new Date(item.timestamp).toLocaleString('vi-VN');
                        
                        // Map status sang tiếng Việt nếu là shipper
                        let displayStatus = item.status;
                        if (item.role === 'shipper' && item.transportStatus) {
                            displayStatus = statusVNMap[item.transportStatus] || item.status;
                            if (item.fromLocation && item.toLocation) {
                                displayStatus += ` - Từ: ${item.fromLocation} → ${item.toLocation}`;
                            }
                        }
                        
                        // Tạo phần QR code nếu có
                        let qrSection = '';
                        if (item.qrCode) {
                            qrSection = `
                                <div class="timeline-qr">
                                    <img src="${item.qrCode}" 
                                         alt="QR Code" 
                                         onclick="enlargeQR('${item.qrCode}', '${item.batchNumber || ''}', '${item.productName || ''}')"
                                         title="Click để phóng to QR code">
                                    <p>📱 Quét QR</p>
                                </div>
                            `;
                        }
                        
                        // Nút cập nhật trạng thái cho shipper - CHỈ HIỆN Ở BLOCK MỚI NHẤT
                        let updateButton = '';
                        if (currentUser.role === 'shipper' && item.role === 'shipper' && item.transportStatus !== 'delivered') {
                            // Tìm block shipper mới nhất (index nhỏ nhất vì data đã sort desc)
                            const shipperBlocks = data.filter(d => d.role === 'shipper');
                            const isLatestShipperBlock = shipperBlocks.length > 0 && shipperBlocks[0].timestamp === item.timestamp;
                            
                            if (isLatestShipperBlock) {
                                const nextStatus = item.transportStatus === 'pickup' ? 'intransit' : 'delivered';
                                const nextStatusVN = statusVNMap[nextStatus];
                                updateButton = `
                                    <button onclick="updateShippingStatus('${item.batchNumber}', '${nextStatus}', '${item.fromLocation || ''}', '${item.toLocation || ''}')" 
                                            class="update-status-btn"
                                            style="margin-top: 10px; padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s;">
                                        🚚 Cập nhật → ${nextStatusVN}
                                    </button>
                                `;
                            }
                        }
                        
                        html += `
                            <div class="timeline-item">
                                <div class="timeline-content">
                                    <div class="timeline-status">📍 ${displayStatus}</div>
                                    <div class="timeline-info"><strong>🕒 Thời gian:</strong> ${timestamp}</div>
                                    <div class="timeline-info"><strong>📦 Tên sản phẩm:</strong> ${item.productName || '-'}</div>
                                    <div class="timeline-info" style="display: flex; align-items: center; gap: 10px;">
                                        <strong>🏷️ Batch Number:</strong> 
                                        <code style="background: #f0f0f0; padding: 4px 8px; border-radius: 4px; font-size: 12px; flex: 1;">${item.batchNumber || '-'}</code>
                                        ${item.batchNumber ? `<button onclick="copyBatchNumber('${item.batchNumber}')" 
                                                style="background: #0277bd; color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">
                                                📋 Copy
                                            </button>` : ''}
                                    </div>
                                    <div class="timeline-info"><strong>📍 Vị trí:</strong> ${item.location}</div>
                                    ${updateButton}
                                </div>
                                ${qrSection}
                            </div>
                        `;
                    });

                    historyContent.innerHTML = html;
                } else {
                    throw new Error(data.error || 'Có lỗi xảy ra');
                }
            } catch (error) {
                historyContent.innerHTML = `
                    <div class="empty-message" style="color: #d32f2f;">
                        ❌ Lỗi tải lịch sử: ${error.message}
                    </div>
                `;
            }
        }

        function getRoleAction(role) {
            const actions = {
                'farmer': 'Ghi nhận thu hoạch',
                'shipper': 'Cập nhật vận chuyển',
                'factory': 'Ghi nhận sản xuất',
                'retailer': 'Ghi nhận bán hàng'
            };
            return actions[role] || 'Cập nhật trạng thái';
        }

        function logout() {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                location.href = 'index.html';
            }
        }

        // Hiển thị thống kê blockchain
        async function showBlockchainStats() {
            try {
                await ensureApiUrl();

                const response = await fetch(`${window.API_URL}/api/blockchain/stats`);
                const result = await response.json();

                if (result.success) {
                    const stats = result.data;
                    const validText = stats.isValid ? '✅ Hợp lệ' : '❌ Không hợp lệ';
                    
                    // ========== THÊM THÔNG TIN CHỮ KÝ SỐ ==========
                    let signatureInfo = '';
                    if (stats.signedBlocks !== undefined) {
                        signatureInfo = `\n\n🔐 CHỮ KÝ SỐ:\n` +
                                      `- Block có chữ ký: ${stats.signedBlocks}\n` +
                                      `- Block chưa ký: ${stats.unsignedBlocks}\n` +
                                      `- Tỷ lệ bảo mật: ${stats.signaturePercentage}%`;
                    }
                    
                    alert(`📊 THỐNG KÊ BLOCKCHAIN\n\n` +
                          `Tổng số Block: ${stats.totalBlocks}\n` +
                          `Độ khó Mining: ${stats.difficulty} (${stats.difficulty} chữ số 0)\n` +
                          `Giao dịch đang chờ: ${stats.pendingTransactions}\n` +
                          `Trạng thái: ${validText}` +
                          signatureInfo +
                          `\n\nBLOCK MỚI NHẤT:\n` +
                          `- Index: #${stats.latestBlock.index}\n` +
                          `- Hash: ${stats.latestBlock.hash.substring(0, 20)}...\n` +
                          `- Thời gian: ${new Date(stats.latestBlock.timestamp).toLocaleString('vi-VN')}`);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert(`❌ Lỗi lấy thống kê: ${error.message}`);
            }
        }

        // Validate blockchain
        async function validateBlockchain(event) {
            try {
                await ensureApiUrl();

                const confirmValidate = confirm('🔍 Xác thực blockchain sẽ kiểm tra:\n' +
                                               '• Tính toàn vẹn của mỗi block\n' +
                                               '• Liên kết giữa các block\n' +
                                               '• Proof of Work (PoW)\n' +
                                               '• Chữ ký số (Digital Signature)\n\n' +
                                               'Tiếp tục?');
                
                if (!confirmValidate) return;
                
                // Show loading
                let button = null;
                if (event && event.target) {
                    button = event.target;
                    button.textContent = '⏳ Đang kiểm tra...';
                    button.disabled = true;
                }
                
                const response = await fetch(`${window.API_URL}/api/blockchain/validate`);
                const result = await response.json();
                const stats = result.stats || {};
                
                // Restore button
                if (button) {
                    button.textContent = '🔍 Kiểm tra tính hợp lệ';
                    button.disabled = false;
                }
                
                if (result.success) {
                    const icon = result.isValid ? '✅' : '❌';
                    const message = result.message;
                    
                    // ========== THÊM THÔNG TIN CHỮ KÝ SỐ ==========
                    let signatureInfo = '';
                    if (typeof stats.verifiedSignatures === 'number') {
                        signatureInfo = `\n\n🔐 KIỂM TRA CHỮ KÝ SỐ:\n` +
                                      `✅ Chữ ký hợp lệ: ${stats.verifiedSignatures}\n` +
                                      `❌ Chữ ký không hợp lệ: ${stats.invalidSignatures ?? 'Không rõ'}`;

                        if (Array.isArray(stats.signatureWarnings) && stats.signatureWarnings.length > 0) {
                            const warningLines = stats.signatureWarnings.slice(0, 3).map(w => `• ${w}`);
                            signatureInfo += `\n\n⚠️ CẢNH BÁO:\n` + warningLines.join('\n');
                            if (stats.signatureWarnings.length > 3) {
                                signatureInfo += `\n... và ${stats.signatureWarnings.length - 3} cảnh báo khác`;
                            }
                        }
                    }
                    
                    alert(`${icon} KẾT QUẢ XÁC THỰC\n\n` +
                          `${message}\n\n` +
                          `📊 THỐNG KÊ:\n` +
                          `Tổng số block: ${stats.totalBlocks ?? 'Không rõ'}\n` +
                          `Độ khó: ${stats.difficulty ?? 'Không rõ'}\n` +
                          (stats.latestBlockHash ? `Latest Hash: ${stats.latestBlockHash.substring(0, 20)}...` : 'Latest Hash: Không rõ') +
                          signatureInfo);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert(`❌ Lỗi xác thực: ${error.message}`);
                // Restore button on error
                if (event && event.target) {
                    event.target.textContent = '🔍 Kiểm tra tính hợp lệ';
                    event.target.disabled = false;
                }
            }
        }

        // Hiển thị QR Code Modal
        function showQRModal(blockData) {
            console.log('🎉 Hiển thị QR Modal cho sản phẩm:', blockData.productId);
            console.log('📦 Block Data:', blockData);
            
            const modal = document.getElementById('qrModal');
            const qrImage = document.getElementById('qrCodeImage');
            const productIdEl = document.getElementById('qrProductId');
            const blockIndexEl = document.getElementById('qrBlockIndex');
            const blockHashEl = document.getElementById('qrBlockHash');

            // Set thông tin
            productIdEl.textContent = blockData.productId;
            blockIndexEl.textContent = blockData.blockIndex;
            blockHashEl.textContent = blockData.blockHash.substring(0, 20) + '...';
            qrImage.src = blockData.qrCode;

            // Hiển thị modal
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            console.log('✅ Modal đã được hiển thị với class:', modal.className);
        }

        // Đóng QR Modal
        function closeQRModal() {
            console.log('🚪 Đóng QR Modal');
            
            const modal = document.getElementById('qrModal');
            
            // Đóng modal bằng cách remove class 'show'
            modal.classList.remove('show');
            
            // Restore body scroll
            document.body.style.overflow = 'auto';
            
            // Reset form và reload history sau khi đóng modal
            if (window.pendingFormReset) {
                console.log('🔄 Reset form và reload history');
                window.pendingFormReset.forEach(input => {
                    if (input.type !== 'select-one') {
                        input.value = '';
                    }
                });
                window.pendingFormReset = null;
                
                // Reload history
                loadUserHistory();
            }
        }

        // Phóng to QR code (từ lịch sử)
        function enlargeQR(qrCodeData, batchNumber, productName) {
            console.log('🔍 Phóng to QR cho batch:', batchNumber, 'sản phẩm:', productName);
            
            const modal = document.getElementById('qrModal');
            const qrImage = document.getElementById('qrCodeImage');
            const productIdEl = document.getElementById('qrProductId');
            const batchNumberEl = document.getElementById('qrBatchNumber');
            const productNameEl = document.getElementById('qrProductName');
            const blockIndexEl = document.getElementById('qrBlockIndex');
            const blockHashEl = document.getElementById('qrBlockHash');

            // Set thông tin
            if (productIdEl) productIdEl.textContent = batchNumber || '';
            if (batchNumberEl) batchNumberEl.textContent = batchNumber || '';
            if (productNameEl) productNameEl.textContent = productName || '';
            if (blockIndexEl) blockIndexEl.textContent = 'Xem từ lịch sử';
            if (blockHashEl) blockHashEl.textContent = 'QR Code đã lưu';
            qrImage.src = qrCodeData;

            // Hiển thị modal
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // Tải xuống QR Code
        function downloadQRCode() {
            const qrImage = document.getElementById('qrCodeImage');
            const batchNumber = document.getElementById('qrBatchNumber')?.textContent || 'batch';
            
            // Tạo link download
            const link = document.createElement('a');
            link.href = qrImage.src;
            link.download = `QR_${batchNumber.replace(/\s+/g, '_')}.png`;
            link.click();
            
            // Hiển thị thông báo thành công (không dùng alert để không block modal)
            setTimeout(() => {
                const confirmed = confirm('✅ Đã tải xuống mã QR!\n\nĐóng cửa sổ này?');
                if (confirmed) {
                    closeQRModal();
                }
            }, 300);
        }

        // Đóng modal khi click bên ngoài - SỬA ĐỂ TRÁNH CONFLICT
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('qrModal');
            
            // Chỉ đóng nếu click vào backdrop (modal), không phải modal-content
            if (event.target === modal && modal.classList.contains('show')) {
                console.log('👆 Click outside modal - đóng');
                closeQRModal();
            }
        });
        
        // Ngăn modal đóng khi click vào nội dung modal
        const modalContent = document.querySelector('.qr-modal-content');
        if (modalContent) {
            modalContent.addEventListener('click', function(event) {
                event.stopPropagation();
                console.log('👆 Click inside modal - giữ mở');
            });
        }


        // Hàm cập nhật trạng thái vận chuyển
        async function updateShippingStatus(batchNumber, newStatus, fromLocation, toLocation) {
            const statusVNMap = {
                'pickup': 'Đã lấy hàng',
                'intransit': 'Đang vận chuyển',
                'delivered': 'Đã giao hàng'
            };
            
            if (!confirm(`Xác nhận cập nhật trạng thái sang "${statusVNMap[newStatus]}"?`)) return;
            
            // Disable tất cả các nút cập nhật
            const updateBtns = document.querySelectorAll('.update-status-btn');
            updateBtns.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.textContent = '⏳ Đang cập nhật...';
            });
            
            try {
                const formData = {
                    batchNumber: batchNumber,
                    status: newStatus,
                    fromLocation: fromLocation,
                    toLocation: toLocation,
                    location: toLocation,
                    actor: currentUser.username,
                    role: currentUser.role
                };
                
                // ========== KÝ GIAO DỊCH ==========
                const user = JSON.parse(localStorage.getItem('user'));
                const signature = signData(formData);
                
                const payload = {
                    data: formData,
                    signature: signature,
                    publicKey: user ? user.publicKey : null
                };
                
                const response = await fetch(`${window.API_URL}/api/record`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    alert(`❌ Lỗi: ${data.message || 'Không thể cập nhật'}`);
                    return;
                }
                
                alert(`✅ Đã cập nhật thành công sang "${statusVNMap[newStatus]}"!`);
                loadUserHistory();
            } catch (error) {
                alert(`❌ Lỗi: ${error.message}`);
                // Re-enable nút nếu có lỗi
                updateBtns.forEach(btn => {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                });
            }
        }

        // Kiểm tra đăng nhập khi tải trang
        checkAuth();
    </script>
