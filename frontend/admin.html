<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Blockchain Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a237e; --shadow: 0 4px 12px rgba(0,0,0,0.08); --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e3f2fd 100%);
            padding: 20px; min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .navbar {
            background: var(--primary); color: white; padding: 20px; border-radius: var(--radius);
            margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;
        }
        .navbar h1 { font-size: 1.6rem; font-weight: 600; }
        #totalBlocks { background: #e8eaf6; padding: 8px 16px; border-radius: 8px; font-weight: 600; }
        .btn { padding: 10px 20px; background: #4caf50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .block {
            background: white; padding: 20px; border-radius: var(--radius); margin-bottom: 20px;
            box-shadow: var(--shadow); position: relative;
        }
        .block::after {
            content: '↓'; position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%);
            font-size: 1.5rem; color: var(--primary);
        }
        .block:last-child::after { display: none; }
        .genesis { border: 2px solid #ffeb3b; background: #fffde7; }
        .block-header { display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .block-index { font-weight: 600; color: var(--primary); }
        .hash-section { background: #f8f9fa; padding: 10px; border-radius: 8px; margin: 10px 0; font-family: monospace; font-size: 0.9rem; word-break: break-all; }
        .data-section { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .data-item { margin: 6px 0; }
        .data-item strong { color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div>
                <h1>Blockchain Explorer</h1>
                <div id="totalBlocks">Tổng số block: Loading...</div>
            </div>
            <button class="btn" onclick="loadBlockchain()">Làm mới</button>
        </div>
        <div id="blockchain"></div>
    </div>

    <script src="js/config.js"></script>
    <script>
        async function loadBlockchain() {
            try {
                const response = await fetch(`${window.API_URL}/api/full-chain`);
                const chain = await response.json();
                document.getElementById('totalBlocks').textContent = `Tổng số block: ${chain.length}`;
                const html = chain.map((block, i) => `
                    <div class="block ${i === 0 ? 'genesis' : ''}">
                        <div class="block-header">
                            <span class="block-index">Block #${i} ${i === 0 ? '(Genesis)' : ''}</span>
                            <span>${new Date(block.timestamp).toLocaleString('vi-VN')}</span>
                        </div>
                        <div class="hash-section">Hash: ${block.hash}</div>
                        <div class="hash-section">Prev: ${block.previousHash}</div>
                        <div class="data-section">
                            <div class="data-item"><strong>Sản phẩm:</strong> ${block.data.productName || '-'}</div>
                            <div class="data-item"><strong>Batch:</strong> ${block.data.batchNumber || '-'}</div>
                            <div class="data-item"><strong>Trạng thái:</strong> ${block.data.status}</div>
                            <div class="data-item"><strong>Vị trí:</strong> ${block.data.location}</div>
                            <div class="data-item"><strong>Người thực hiện:</strong> ${block.data.actor}</div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('blockchain').innerHTML = html;
            } catch (error) {
                alert('Lỗi tải blockchain');
            }
        }
        loadBlockchain();
    </script>
</body>
</html>
